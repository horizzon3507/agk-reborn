name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - "22"
          - "24"
    steps:
      - name: Configure LF line endings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint and typecheck
        run: pnpm run check

      - name: Run test suite
        run: node --test 'tests/*.test.ts'

      - name: Verify npm tarball contents and size
        if: runner.os == 'Linux' && matrix.node-version == '22'
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const out = execFileSync("npm", ["pack", "--dry-run", "--ignore-scripts", "--json"], { encoding: "utf8" });
            const info = JSON.parse(out)[0];
            if (info.unpackedSize > 2_000_000) {
              throw new Error("Tarball unpackedSize too large: " + info.unpackedSize);
            }
            console.log("Verified tarball:", info.filename, info.unpackedSize, "bytes");
          '
